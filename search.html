<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Found Items</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .back-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #667eea;
        }

        h1 {
            color: #333;
            font-size: 2em;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .search-container {
            position: relative;
            margin-top: 20px;
        }

        .search-box {
            width: 100%;
            padding: 16px 50px 16px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 20px;
            cursor: pointer;
        }

        .sort-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sort-label {
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .sort-select {
            padding: 10px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sort-select:focus {
            border-color: #667eea;
        }

        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .item-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .item-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 60px;
            position: relative;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-content {
            padding: 20px;
        }

        .item-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .item-description {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .item-location {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .item-date {
            color: #00f2fe;
            font-weight: 600;
            font-size: 0.9em;
        }

        .item-contact {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .contact-info {
            font-size: 0.85em;
            color: #555;
            margin: 5px 0;
        }

        .no-results {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .no-results-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .no-results h2 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .no-results p {
            color: #666;
            font-size: 1.1em;
        }

        .loading {
            text-align: center;
            padding: 60px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .loading-spinner {
            font-size: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .zoom-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
        }

        .zoom-modal.active {
            display: flex;
        }

        .zoom-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .zoom-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: white;
            font-size: 50px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .zoom-close:hover {
            transform: scale(1.2);
        }

        .dialog-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        .dialog-modal.active {
            display: flex;
        }

        .dialog-box {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .dialog-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .dialog-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .dialog-text {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .dialog-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .dialog-btn {
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .dialog-btn-yes {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
        }

        .dialog-btn-yes:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.5);
        }

        .dialog-btn-no {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .dialog-btn-no:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
        }

        .dialog-btn-ok {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            width: 60%;
        }

        .dialog-btn-ok:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        @media (max-width: 768px) {
            .results-container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5em;
            }

            .sort-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .dialog-buttons {
                flex-direction: column;
            }

            .dialog-btn {
                width: 100%;
            }

            .dialog-btn-ok {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← Back</button>
            <h1>Search Found Items</h1>
            <div class="search-container">
                <input type="text" class="search-box" placeholder="Search for items..." id="searchInput">
                <span class="search-icon" onclick="performSearch()">🔍</span>
            </div>
            <div class="sort-container">
                <span class="sort-label">Sort by:</span>
                <select class="sort-select" id="sortSelect" onchange="applySorting()">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                </select>
            </div>
        </div>

        <div id="resultsArea">
            <div class="loading">
                <div class="loading-spinner">⏳</div>
                <p>Loading items...</p>
            </div>
        </div>
    </div>

    <div id="zoomModal" class="zoom-modal" onclick="closeZoom()">
        <span class="zoom-close">&times;</span>
        <img class="zoom-content" id="zoomedImg">
    </div>

    <div id="dialogModal" class="dialog-modal">
        <div class="dialog-box" id="dialogBox">
            <div class="dialog-icon" id="dialogIcon">🔍</div>
            <div class="dialog-title" id="dialogTitle">Has this item been returned to the owner?</div>
            <div class="dialog-text" id="dialogText">If the item has been returned, we'll remove it from the found items
                list.</div>
            <div class="dialog-buttons" id="dialogButtons">
                <button class="dialog-btn dialog-btn-yes" onclick="markAsReturned()">Yes</button>
                <button class="dialog-btn dialog-btn-no" onclick="showHopeMessageFound()">No</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rprnjjnuzybalvqkdtzq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcm5qam51enliYWx2cWtkdHpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MjUwNjgsImV4cCI6MjA3NjAwMTA2OH0.PCmYbcrYcSDu6o55_Qs90jzcErbSyBlAMbUztfJYuN8';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allItems = [];
        let currentItemId = null;

        function goBack() {
            window.location.href = 'index.html';
        }

        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            const url = new URL(window.location.href);
            url.searchParams.set('q', searchTerm);
            window.location.href = url.toString();
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        function openZoom(imgSrc, event) {
            event.stopPropagation();
            document.getElementById('zoomedImg').src = imgSrc;
            document.getElementById('zoomModal').classList.add('active');
        }

        function closeZoom() {
            document.getElementById('zoomModal').classList.remove('active');
        }

        function openDialog(itemId) {
            currentItemId = itemId;
            document.getElementById('dialogIcon').textContent = '🔍';
            document.getElementById('dialogTitle').textContent = 'Has this item been returned to the owner?';
            document.getElementById('dialogText').textContent = "If the item has been returned, we'll remove it from the found items list.";
            document.getElementById('dialogButtons').innerHTML = `
                <button class="dialog-btn dialog-btn-yes" onclick="markAsReturned()">Yes</button>
                <button class="dialog-btn dialog-btn-no" onclick="showHopeMessageFound()">No</button>
            `;
            document.getElementById('dialogModal').classList.add('active');
        }

        function closeDialog() {
            document.getElementById('dialogModal').classList.remove('active');
            currentItemId = null;
        }

        function showHopeMessageFound() {
            document.getElementById('dialogIcon').textContent = '💫';
            document.getElementById('dialogTitle').textContent = 'We Hope The Owner Finds It!';
            document.getElementById('dialogText').textContent = 'Stay positive! The owner might be searching for it right now.';
            document.getElementById('dialogButtons').innerHTML = `
                <button class="dialog-btn dialog-btn-ok" onclick="closeDialog()">OK</button>
            `;
        }

        async function markAsReturned() {
            if (!currentItemId) return;

            try {
                const { error } = await supabase
                    .from('found_items')
                    .update({ status: 'returned' })
                    .eq('id', currentItemId);

                if (error) throw error;

                document.getElementById('dialogIcon').textContent = '🎉';
                document.getElementById('dialogTitle').textContent = 'Wonderful!';
                document.getElementById('dialogText').textContent = 'Great news! The item has been marked as returned and removed from the list.';
                document.getElementById('dialogButtons').innerHTML = `
                    <button class="dialog-btn dialog-btn-ok" onclick="reloadPage()">OK</button>
                `;

            } catch (error) {
                console.error('Error:', error);
                alert('Error updating item: ' + error.message);
                closeDialog();
            }
        }

        function reloadPage() {
            window.location.reload();
        }

        function applySorting() {
            const sortValue = document.getElementById('sortSelect').value;
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('q') || '';

            displayResults(allItems, searchQuery);
        }

        async function loadItems() {
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('q') || '';

            if (searchQuery) {
                document.getElementById('searchInput').value = searchQuery;
            }

            try {
                let query = supabase
                    .from('found_items')
                    .select('*');

                if (searchQuery) {
                    query = query.or(`item_name.ilike.%${searchQuery}%,item_description.ilike.%${searchQuery}%`);
                }

                const { data, error } = await query;

                if (error) throw error;

                // Filter only items without status or with active status
                allItems = data.filter(item => !item.status || item.status === 'active');
                displayResults(allItems, searchQuery);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('resultsArea').innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">⚠️</div>
                        <h2>Error Loading Items</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function displayResults(items, searchQuery) {
            const resultsArea = document.getElementById('resultsArea');
            const sortValue = document.getElementById('sortSelect').value;

            let sortedItems = [...items];

            switch (sortValue) {
                case 'newest':
                    sortedItems.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                    break;
                case 'oldest':
                    sortedItems.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                    break;
                case 'name-asc':
                    sortedItems.sort((a, b) => a.item_name.localeCompare(b.item_name));
                    break;
                case 'name-desc':
                    sortedItems.sort((a, b) => b.item_name.localeCompare(a.item_name));
                    break;
            }

            if (sortedItems.length === 0) {
                resultsArea.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <h2>No Items Found</h2>
                        <p>${searchQuery ? `No results for "${searchQuery}"` : 'No items have been reported yet'}</p>
                    </div>
                `;
                return;
            }

            const cardsHTML = sortedItems.map(item => {
                const date = new Date(item.date_found).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                return `
                    <div class="item-card" onclick="openDialog('${item.id}')">
                        <div class="item-image" ${item.photo_url ? `onclick="openZoom('${item.photo_url}', event)"` : ''}>
                            ${item.photo_url
                        ? `<img src="${item.photo_url}" alt="${item.item_name}">`
                        : '📦'}
                        </div>
                        <div class="item-content">
                            <div class="item-name">${item.item_name}</div>
                            <div class="item-description">${item.item_description}</div>
                            <div class="item-location">📍 ${item.location || 'Location not specified'}</div>
                            <div class="item-date">Found: ${date}</div>
                            <div class="item-contact">
                                <div class="contact-info">👤 ${item.contact_name}</div>
                                <div class="contact-info">📞 ${item.contact_phone}</div>
                                <div class="contact-info">✉️ ${item.contact_email}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            resultsArea.innerHTML = `<div class="results-container">${cardsHTML}</div>`;
        }

        loadItems();
    </script>
</body>

</html>
