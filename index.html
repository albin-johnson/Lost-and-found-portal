<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 60px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 650px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .user-section {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-name {
            color: #667eea;
            font-weight: 600;
            font-size: 0.95em;
        }

        .logout-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .stats-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 40px;
            gap: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 20px;
            flex: 1;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .search-container {
            margin-bottom: 40px;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 18px 50px 18px 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        .search-box:focus {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 20px;
            cursor: pointer;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 18px 30px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-lost {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-lost:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-found {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-found:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
        }

        .btn-view-lost {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            grid-column: span 2;
        }

        .btn-view-lost:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(250, 112, 154, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }

            .user-section {
                position: static;
                justify-content: center;
                margin-bottom: 20px;
                flex-direction: column;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 25px;
            }

            .stats-container {
                flex-direction: column;
                gap: 15px;
            }

            .btn {
                padding: 15px 40px;
                font-size: 16px;
            }

            .button-container {
                grid-template-columns: 1fr;
            }

            .btn-view-lost {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="user-section">
            <span class="user-name" id="userName">Welcome!</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <h1>Welcome to Lost and Found Portal</h1>

        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-number" id="lostCount">0</div>
                <div class="stat-label">Lost Items</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="foundCount">0</div>
                <div class="stat-label">Found Items</div>
            </div>
        </div>

        <div class="search-container">
            <input type="text" class="search-box" placeholder="Search for found items..." id="searchInput">
            <span class="search-icon" onclick="performSearch()">🔍</span>
        </div>

        <div class="button-container">
            <button class="btn btn-lost" onclick="goToLost()">Lost</button>
            <button class="btn btn-found" onclick="goToFound()">Found</button>
            <button class="btn btn-view-lost" onclick="viewLostItems()">View All Lost Items</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rprnjjnuzybalvqkdtzq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcm5qam51enliYWx2cWtkdHpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MjUwNjgsImV4cCI6MjA3NjAwMTA2OH0.PCmYbcrYcSDu6o55_Qs90jzcErbSyBlAMbUztfJYuN8';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Check authentication on page load
        window.addEventListener('load', async () => {
            const { data: { session } } = await supabase.auth.getSession();

            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            // Display user name
            const userName = session.user.user_metadata?.full_name || session.user.email;
            document.getElementById('userName').textContent = `Hello, ${userName}!`;
        });

        async function logout() {
            try {
                const { error } = await supabase.auth.signOut();
                if (error) throw error;
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Error logging out:', error);
                alert('Error logging out');
            }
        }

        async function loadStats() {
            try {
                // Get lost items count
                const { data: lostData } = await supabase
                    .from('lost_items')
                    .select('*');

                const lostCount = lostData ? lostData.filter(item => !item.status || item.status === 'active').length : 0;

                // Get found items count
                const { data: foundData } = await supabase
                    .from('found_items')
                    .select('*');

                const foundCount = foundData ? foundData.filter(item => !item.status || item.status === 'active').length : 0;

                document.getElementById('lostCount').textContent = lostCount;
                document.getElementById('foundCount').textContent = foundCount;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function goToLost() {
            window.location.href = 'lost.html';
        }

        function goToFound() {
            window.location.href = 'found.html';
        }

        function viewLostItems() {
            window.location.href = 'lost-items.html';
        }

        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (searchTerm) {
                window.location.href = `search.html?q=${encodeURIComponent(searchTerm)}`;
            } else {
                window.location.href = 'search.html';
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        loadStats();
    </script>
</body>

</html>
