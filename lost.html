<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Lost Item</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 50px 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            margin: 0 auto;
            backdrop-filter: blur(10px);
        }

        .back-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #f5576c;
        }

        h1 {
            color: #333;
            font-size: 2.2em;
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea,
        input[type="date"] {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 2px solid #000;
            border-radius: 15px;
            outline: none;
            transition: all 0.3s ease;
            background: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        textarea:focus,
        input[type="date"]:focus {
            border-color: #f5576c;
            box-shadow: 0 0 20px rgba(245, 87, 108, 0.2);
            transform: translateY(-2px);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .file-upload {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-upload input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border: 3px dashed #000;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #555;
            font-weight: 600;
        }

        .file-upload-label:hover {
            border-color: #f5576c;
            background: rgba(245, 87, 108, 0.05);
            transform: translateY(-2px);
        }

        .file-upload-icon {
            font-size: 30px;
            margin-right: 15px;
        }

        .file-name {
            margin-top: 10px;
            color: #f5576c;
            font-size: 14px;
            font-weight: 600;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.5);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: #f5576c;
            margin-top: 10px;
            font-weight: 600;
            font-size: 16px;
        }

        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 1.6em;
                margin-bottom: 30px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <button class="back-btn" onclick="goBack()">← Back</button>

        <h1>Report Lost Item</h1>

        <form id="lostForm">
            <div class="form-group">
                <label for="itemName">Item Name *</label>
                <input type="text" id="itemName" name="itemName" placeholder="Enter item name" required>
            </div>

            <div class="form-group">
                <label for="itemDescription">Item Description *</label>
                <textarea id="itemDescription" name="itemDescription" placeholder="Provide detailed description"
                    required></textarea>
            </div>

            <div class="form-group">
                <label for="location">Location Lost *</label>
                <input type="text" id="location" name="location" placeholder="Where did you lose it?" required>
            </div>

            <div class="form-group">
                <label for="dateLost">Date Lost *</label>
                <input type="date" id="dateLost" name="dateLost" required>
            </div>

            <div class="form-group">
                <label for="contactName">Your Name *</label>
                <input type="text" id="contactName" name="contactName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="contactPhone">Phone Number *</label>
                <input type="tel" id="contactPhone" name="contactPhone" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label for="contactEmail">Email Address *</label>
                <input type="email" id="contactEmail" name="contactEmail" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="itemPhoto">Upload Photo (Optional)</label>
                <div class="file-upload">
                    <input type="file" id="itemPhoto" name="itemPhoto" accept="image/*" onchange="displayFileName()">
                    <label for="itemPhoto" class="file-upload-label">
                        <span class="file-upload-icon">📷</span>
                        <span>Click to upload photo</span>
                    </label>
                </div>
                <div class="file-name" id="fileName"></div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Submit Report</button>
            <div class="loading" id="loadingMsg" style="display: none;">
                <span class="spinner">⏳</span> Uploading...
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://rprnjjnuzybalvqkdtzq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwcm5qam51enliYWx2cWtkdHpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MjUwNjgsImV4cCI6MjA3NjAwMTA2OH0.PCmYbcrYcSDu6o55_Qs90jzcErbSyBlAMbUztfJYuN8';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function goBack() {
            window.location.href = 'index.html';
        }

        function displayFileName() {
            const input = document.getElementById('itemPhoto');
            const fileNameDisplay = document.getElementById('fileName');

            if (input.files && input.files[0]) {
                fileNameDisplay.textContent = '📎 ' + input.files[0].name;
            }
        }

        document.getElementById('lostForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const loadingMsg = document.getElementById('loadingMsg');

            submitBtn.disabled = true;
            loadingMsg.style.display = 'block';

            try {
                const itemName = document.getElementById('itemName').value;
                const itemDescription = document.getElementById('itemDescription').value;
                const location = document.getElementById('location').value;
                const dateLost = document.getElementById('dateLost').value;
                const contactName = document.getElementById('contactName').value;
                const contactPhone = document.getElementById('contactPhone').value;
                const contactEmail = document.getElementById('contactEmail').value;
                const photoFile = document.getElementById('itemPhoto').files[0];

                let photoUrl = null;

                if (photoFile) {
                    const fileExt = photoFile.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                    const filePath = `lost/${fileName}`;

                    const { error: uploadError } = await supabase.storage
                        .from('items')
                        .upload(filePath, photoFile);

                    if (uploadError) throw uploadError;

                    const { data: urlData } = supabase.storage
                        .from('items')
                        .getPublicUrl(filePath);

                    photoUrl = urlData.publicUrl;
                }

                const { error } = await supabase
                    .from('lost_items')
                    .insert([{
                        item_name: itemName,
                        item_description: itemDescription,
                        location: location,
                        date_lost: dateLost,
                        contact_name: contactName,
                        contact_phone: contactPhone,
                        contact_email: contactEmail,
                        photo_url: photoUrl,
                        status: 'active'
                    }]);

                if (error) throw error;

                alert('Lost item report submitted successfully!');
                this.reset();
                document.getElementById('fileName').textContent = '';

            } catch (error) {
                console.error('Error:', error);
                alert('Error submitting report: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                loadingMsg.style.display = 'none';
            }
        });

        document.getElementById('dateLost').max = new Date().toISOString().split('T')[0];
    </script>
</body>

</html>
